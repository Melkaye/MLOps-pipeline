name: ML Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:       # optional manual trigger; delete if you want only push and PR

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run full test suite
        run: pytest tests/ -v

  train:
    name: Train and verify model
    needs: test            # runs only if the test job passes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download data
        run: python src/download_data.py

      - name: Validate data
        run: python src/validate_data.py

      - name: Train model and check performance thresholds
        run: python src/train.py        # exits non-zero if a threshold is not met

      - name: Prepare drift check data
        run: |
          python - <<'EOF'
          import pandas as pd
          df = pd.read_csv("data/heart_disease.csv")
          reference = df.sample(frac=0.7, random_state=1)
          current = df.drop(reference.index)
          reference.to_csv("data/reference.csv", index=False)
          current.to_csv("data/current.csv", index=False)
          EOF

      - name: Check drift
        run: python src/drift_check.py data/reference.csv data/current.csv

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pipeline-reports
          path: reports/
          if-no-files-found: ignore
