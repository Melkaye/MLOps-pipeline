name: ML Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run full test suite
        run: pytest tests/ -v

  train:
    name: Train and verify model
    needs: test            # runs only if the test job passes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download data
        run: python src/download_data.py

      - name: Validate data
        run: python src/validate_data.py

      - name: Train model and check performance thresholds
        run: python src/train.py        # exits non-zero if a threshold is not met

  monitor-drift:
    name: Monitor data drift
    needs: test            # runs in parallel with train, only after tests pass
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download data
        run: python src/download_data.py

      - name: Prepare reference and current data
        run: python src/make_drift_data.py

      - name: Run drift detection
        run: python src/monitor_drift.py   # exits 1 if drift share exceeds the threshold

      - name: Upload drift reports
        if: always()                        # keep the report even when drift fails the job
        uses: actions/upload-artifact@v5
        with:
          name: drift-reports
          path: reports/
          if-no-files-found: ignore
