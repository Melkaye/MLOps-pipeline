name: ML Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Download data
        run: python src/download_data.py
      - name: Validate data
        run: python src/validate_data.py
      - name: Run tests
        run: pytest tests/
      - name: Train model
        run: python src/train.py
      - name: Check drift
        run: python src/drift_check.py data/reference.csv data/current.csv
